name: CI

on:
  push:
    branches: ["main", "lab-*", "java-*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  java-quality:
    name: Java 25 Maven verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test Java project
        working-directory: java
        run: mvn --batch-mode --no-transfer-progress verify

  python-reference:
    name: Python reference checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install original Python baseline and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint Python reference
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .
      - name: Type check Python reference
        run: mypy
      - name: Test Python reference
        run: pytest
